CONFIG_ZTEST=y
# Keep the driver's 100 us polls well below its 20 ms drain deadline.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_PTP_CLOCK=y
CONFIG_NET_ETHERNET_PTP_OFFLOAD=y
